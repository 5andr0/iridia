[package]
name = "wgsl-run"
description = "Runs a WGSL program's entry point on the DX12 WARP adapter through wgpu, for iridia's tests: an executor iridia does not write"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/iridia"
publish = false

# its own workspace: wgpu stays out of iridia's lockfile and builds
[workspace]

[dependencies]
# wgpu's own naga reads the WGSL and takes the rewritten entry point (`ShaderSource::Naga`)
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "naga-ir", "wgsl", "std", "parking_lot"] }

[lints.rust]
unsafe_code = "deny"
