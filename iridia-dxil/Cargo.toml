[package]
name = "iridia-dxil"
description = "Translate Direct3D Shader Model 6 bytecode (DXIL, dxc output) to naga modules, for WGSL or SPIR-V output"
readme = "README.md"
keywords = ["dxil", "hlsl", "wgsl", "shader", "direct3d"]
categories = ["graphics", "compilers", "game-development"]
documentation = "https://docs.rs/iridia-dxil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dxcontainer.workspace = true
iridia.workspace = true
iridia-ir.workspace = true
dxil-reader.workspace = true
naga.workspace = true
half.workspace = true

[dev-dependencies]
iridia-exec = { path = "../iridia-exec" }
# tests/semantics.rs: what the naga lowering refuses (texture atomic results)
iridia-naga = { path = "../iridia-naga", default-features = false, features = ["wgsl"] }
iridia-passes = { path = "../iridia-passes" }
# tests/lift_corpus.rs reads the text of iridia-wgsl back with it; tests/exec_warp_rq.rs: stock naga writes a lowered module, or iridia-wgsl's WGSL read back, as HLSL (the writer wgpu runs on
# Direct3D 12)
iridia-wgsl = { path = "../iridia-wgsl" }
naga-hlsl = { package = "naga", version = "=30.0.1", default-features = false, features = ["hlsl-out", "wgsl-in"] }
primase-testdata.workspace = true
serde_json.workspace = true


[lints]
workspace = true
