name: ci
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
  wasm:
    # every library crate builds for the browser, with each writer feature the IR path uses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --target wasm32-unknown-unknown -p iridia-ir -p iridia-interface -p iridia-passes -p iridia-exec-ir -p iridia-d3d9-ir
      - run: cargo build --locked --target wasm32-unknown-unknown -p iridia -p iridia-d3d9 -p iridia-dxbc -p iridia-dxil -p iridia-mojo -p iridia-exec
      - run: cargo build --locked --target wasm32-unknown-unknown -p iridia-naga --no-default-features
      - run: cargo build --locked --target wasm32-unknown-unknown -p iridia-naga --features wgsl
  release:
    # a commit that moves a version releases it once every check passed (CONTRIBUTING.md, Releasing)
    needs: [check, wasm]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - id: plan
        run: python3 .github/release.py plan
      - if: steps.plan.outputs.crates
        run: python3 .github/release.py verify
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
      - if: steps.plan.outputs.crates
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.plan.outputs.plan != '[]'
        run: python3 .github/release.py publish
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
