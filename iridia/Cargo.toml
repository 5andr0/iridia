[package]
name = "iridia"
description = "Compiled Direct3D shaders as naga modules: the program type the iridia readers produce, with validation, a WGSL writer and analyses"
readme = "README.md"
keywords = ["dxbc", "wgsl", "spirv", "shader", "decompiler"]
categories = ["graphics", "compilers", "game-development"]
documentation = "https://docs.rs/iridia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iridia-interface.workspace = true
iridia-ir.workspace = true
iridia-passes.workspace = true
thiserror.workspace = true
naga.workspace = true
sha2.workspace = true

[dev-dependencies]
iridia-exec = { path = "../iridia-exec" }
iridia-mojo = { path = "../iridia-mojo" }
# The lifters, to run each fixture of tests/flow.rs through both bytecodes (a dev-dependency cycle cargo allows).
iridia-dxbc = { path = "../iridia-dxbc" }
iridia-dxil = { path = "../iridia-dxil" }
# naga's WGSL front end, to read a writer's text back (tests/wgsl_for.rs, tests/slim.rs)
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }
# tests/slim.rs, the pre-push gate: every lifter of every family over the slim shader set
iridia-d3d9 = { path = "../iridia-d3d9" }
iridia-d3d9-ir = { path = "../iridia-d3d9-ir" }
iridia-naga = { path = "../iridia-naga", default-features = false, features = ["wgsl"] }
# the examples write WGSL with iridia-wgsl, and SPIR-V with the naga iridia-naga lowers to (published naga 30.0.1)
iridia-wgsl = { path = "../iridia-wgsl" }
naga-spv = { package = "naga", version = "=30.0.1", default-features = false, features = ["spv-out"] }
primase-testdata.workspace = true

[lints]
workspace = true
