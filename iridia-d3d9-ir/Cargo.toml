[package]
name = "iridia-d3d9-ir"
description = "Read raw Direct3D 9 shader tokens of shader models 1 to 3 and lift them into iridia's shader IR"
readme = "README.md"
keywords = ["direct3d9", "shader", "ir", "bytecode"]
categories = ["graphics", "compilers", "game-development"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
d3d9-reader.workspace = true
iridia-ir.workspace = true

[dev-dependencies]
# tests/gate.rs, tests/assembled.rs and tests/vkd3d.rs run the IR in iridia-exec-ir and compiled into iridia-exec, and the WGSL
# of both writers on WARP (tests/warp); the text is also read back and validated with the published naga's WGSL front end
iridia-exec = { path = "../iridia-exec" }
iridia-exec-ir = { path = "../iridia-exec-ir" }
iridia-naga = { path = "../iridia-naga", default-features = false, features = ["wgsl"] }
iridia-passes = { path = "../iridia-passes" }
iridia-warp-client.workspace = true
iridia-wgsl = { path = "../iridia-wgsl" }
# tests/harness reads the text of both WGSL writers back with the published naga
naga-wgsl = { package = "naga", version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
primase-testdata.workspace = true
serde_json.workspace = true

[lints]
workspace = true
