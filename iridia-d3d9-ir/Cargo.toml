[package]
name = "iridia-d3d9-ir"
description = "Read raw Direct3D 9 ps_3_0 and vs_3_0 shader tokens and lift them into iridia's shader IR"
readme = "README.md"
keywords = ["direct3d9", "shader", "ir", "bytecode"]
categories = ["graphics", "compilers", "game-development"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
d3d9-reader.workspace = true
iridia-ir.workspace = true

[dev-dependencies]
# the gate (tests/gate.rs) holds this crate to the naga-based lifter it replaces, run in that lifter's executor; naga
# here is that lifter's, with its WGSL front end to read the new WGSL back
iridia.workspace = true
iridia-d3d9.workspace = true
iridia-exec.workspace = true
iridia-exec-ir.workspace = true
iridia-naga = { workspace = true, features = ["wgsl"] }
iridia-passes.workspace = true
naga = { workspace = true, features = ["wgsl-in"] }
primase-testdata.workspace = true

[lints]
workspace = true
