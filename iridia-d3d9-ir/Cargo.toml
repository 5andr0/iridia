[package]
name = "iridia-d3d9-ir"
description = "Read raw Direct3D 9 shader tokens of shader models 1 to 3 and lift them into iridia's shader IR"
readme = "README.md"
keywords = ["direct3d9", "shader", "ir", "bytecode"]
categories = ["graphics", "compilers", "game-development"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
d3d9-reader.workspace = true
iridia-ir.workspace = true

[dev-dependencies]
# the gate (tests/gate.rs) holds this crate to the naga-based lifter it replaces, run in that lifter's executor; naga
# here is that lifter's, with its WGSL front end to read the new WGSL back
iridia = { path = "../iridia" }
iridia-d3d9 = { path = "../iridia-d3d9" }
iridia-exec = { path = "../iridia-exec" }
iridia-exec-ir = { path = "../iridia-exec-ir" }
iridia-naga = { path = "../iridia-naga", default-features = false, features = ["wgsl"] }
iridia-passes = { path = "../iridia-passes" }
naga = { workspace = true, features = ["wgsl-in"] }
primase-testdata.workspace = true
serde_json.workspace = true

[lints]
workspace = true
