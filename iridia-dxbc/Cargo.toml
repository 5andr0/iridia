[package]
name = "iridia-dxbc"
description = "Translate Direct3D Shader Model 4 and 5 bytecode (DXBC, fxc output) to naga modules, for WGSL or SPIR-V output"
readme = "README.md"
keywords = ["dxbc", "hlsl", "wgsl", "shader", "direct3d"]
categories = ["graphics", "compilers", "game-development"]
documentation = "https://docs.rs/iridia-dxbc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iridia.workspace = true
iridia-ir.workspace = true
dxcontainer.workspace = true
dxbc-reader.workspace = true
naga.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
serde_json.workspace = true

iridia-exec = { path = "../iridia-exec" }
iridia-dxil = { path = "../iridia-dxil" }
iridia-passes = { path = "../iridia-passes" }
proptest.workspace = true
# tests/ir_gate.rs's column C: the IR lowered to stock naga, its WGSL read back by naga's front end
iridia-naga = { path = "../iridia-naga", default-features = false, features = ["wgsl"] }
naga = { workspace = true, features = ["wgsl-in"] }
[lints]
workspace = true
