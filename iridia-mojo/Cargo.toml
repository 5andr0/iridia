[package]
name = "iridia-mojo"
description = "Translate the GLSL that MojoShader writes from Direct3D 9 shaders to naga modules, for WGSL or SPIR-V output"
readme = "README.md"
keywords = ["mojoshader", "glsl", "shader", "wgsl", "direct3d9"]
categories = ["graphics", "compilers", "game-development"]
documentation = "https://docs.rs/iridia-mojo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
iridia.workspace = true
iridia-ir.workspace = true
naga.workspace = true

[dev-dependencies]
# tests/oracle.rs and tests/ir.rs run the IR lift beside the D3D9 program the GLSL was made from (iridia-d3d9-ir), in
# both executors, and beside the older lift
d3d9-reader.workspace = true
iridia-d3d9-ir.workspace = true
iridia-exec.workspace = true
iridia-exec-ir.workspace = true
iridia-naga = { workspace = true, features = ["wgsl"] }
iridia-passes.workspace = true
primase-testdata.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
