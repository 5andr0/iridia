[workspace]
resolver = "3"
members = ["iridia", "iridia-d3d9", "iridia-d3d9-ir", "iridia-dxbc", "iridia-dxil", "iridia-exec", "iridia-exec-ir", "iridia-interface", "iridia-ir", "iridia-mojo", "iridia-naga", "iridia-passes"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/iridia"
publish = true

[workspace.dependencies]
d3d9-reader = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "5b58dd383e54b9ad118edb78d0ca0f57e51db068" }
dxbc-reader = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "5b58dd383e54b9ad118edb78d0ca0f57e51db068" }
dxcontainer = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "5b58dd383e54b9ad118edb78d0ca0f57e51db068" }
dxil-reader = { version = "0.4.0", git = "https://github.com/Kalmarv/dx", rev = "5b58dd383e54b9ad118edb78d0ca0f57e51db068" }
half = { version = "=2.7.1", default-features = false }
iridia = { version = "0.4.1", path = "iridia" }
iridia-d3d9 = { path = "iridia-d3d9" }
iridia-d3d9-ir = { version = "0.4.1", path = "iridia-d3d9-ir" }
iridia-exec-ir = { version = "0.4.1", path = "iridia-exec-ir" }
iridia-naga = { version = "0.4.1", path = "iridia-naga", default-features = false }
iridia-dxbc = { path = "iridia-dxbc" }
iridia-dxil = { path = "iridia-dxil" }
iridia-exec = { path = "iridia-exec" }
iridia-interface = { version = "0.4.1", path = "iridia-interface" }
iridia-ir = { version = "0.4.1", path = "iridia-ir" }
iridia-passes = { version = "0.4.1", path = "iridia-passes" }
naga = { version = "30.0.1", package = "primase-naga", git = "https://github.com/Kalmarv/primase-naga", rev = "8e6519c3eac6f08519c61c40cb6516ea95f6dde9", default-features = false, features = ["wgsl-out"] }
primase-foundations = "0.3.1"
primase-testdata = "0.1.8"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
