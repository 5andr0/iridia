[package]
name = "iridia-passes"
description = "Passes over iridia's shader IR: variable promotion, simplification, specialisation, structurization and target legalization"
readme = "README.md"
keywords = ["shader", "ir", "ssa", "compiler"]
categories = ["graphics", "compilers", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iridia-ir.workspace = true

[dev-dependencies]
iridia-exec = { path = "../iridia-exec" }
iridia-exec-ir = { path = "../iridia-exec-ir" }
iridia-naga = { path = "../iridia-naga", default-features = false, features = ["wgsl"] }
iridia-wgsl = { path = "../iridia-wgsl" }

[lints]
workspace = true
